name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Confirm publication of the package version currently on master"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: inputs.confirm_publish == true && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify npm trusted publisher workflow context
        run: |
          node --input-type=module -e '
            if (process.env.GITHUB_REPOSITORY !== "vsimko/solr-ts-client") throw new Error("Unexpected repository claim");
            if (process.env.GITHUB_WORKFLOW_REF !== "vsimko/solr-ts-client/.github/workflows/publish.yml@refs/heads/master") throw new Error("Unexpected workflow_ref: " + process.env.GITHUB_WORKFLOW_REF);
            if (process.env.GITHUB_REF !== "refs/heads/master") throw new Error("Unexpected ref");
            if (process.env.GITHUB_JOB !== "publish") throw new Error("Unexpected job");
          '
      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@11.15.0
          node --version
          npm --version
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const [nodeMajor, nodeMinor] = process.versions.node.split(".").map(Number);
            if (nodeMajor < 22 || (nodeMajor === 22 && nodeMinor < 14)) {
              throw new Error("Trusted publishing requires Node.js 22.14.0 or newer");
            }
            const [npmMajor, npmMinor, npmPatch] = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number);
            if (npmMajor < 11 || (npmMajor === 11 && (npmMinor < 15))) {
              throw new Error("Trusted publishing requires npm 11.15.0 or newer");
            }
          '
      - run: npm ci
      # npm stage publish runs prepublishOnly, which performs type checks,
      # tests, build, release checks, and package dry-run before staging.
      # setup-node may leave a dummy NODE_AUTH_TOKEN without registry-url.
      # Clear it for this step so npm can use the GitHub OIDC trusted publisher.
      - name: Stage with npm trusted publishing
        env:
          NODE_AUTH_TOKEN: ""
        run: npm run release:stage
