name: CI

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, docs/github-pages-architecture]
  workflow_dispatch:
    inputs:
      enable_destructive_solrcloud_tests:
        description: "Run opt-in SPLITSHARD and MIGRATE checks on the disposable two-node cluster"
        required: false
        default: false
        type: boolean
      enable_forceleader_fault_injection:
        description: "Run stale-replica FORCELEADER fault injection; acknowledged updates may be lost on disposable test data"
        required: false
        default: false
        type: boolean
      candidate_solr_version:
        description: "Optional official stable Solr version to add to standalone, security-enabled, and SolrCloud qualification matrices"
        required: false
        type: string
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      website_only: ${{ steps.classify.outputs.website_only }}
      solr_matrix_include: ${{ steps.classify.outputs.solr_matrix_include }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: classify
        name: Classify change set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          CANDIDATE_SOLR_VERSION: ${{ inputs.candidate_solr_version }}
        run: |
          solr_matrix_include='[]'
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$CANDIDATE_SOLR_VERSION" ]]; then
            if ! [[ "$CANDIDATE_SOLR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Candidate Solr version must be an exact stable x.y.z version." >&2
              exit 1
            fi

            node --input-type=module <<'NODE'
            import { readFileSync } from "node:fs";
            import { compareVersions, parseSolrMatrixVersions } from "./scripts/check-solr-releases.mjs";

            const candidate = process.env.CANDIDATE_SOLR_VERSION;
            const configured = parseSolrMatrixVersions(readFileSync(".github/workflows/ci.yml", "utf8"));
            const newestBaseline = configured.at(-1);
            if (configured.includes(candidate)) {
              throw new Error("Solr " + candidate + " is already pinned in the standard CI matrix.");
            }
            if (compareVersions(candidate, newestBaseline) <= 0) {
              throw new Error("Candidate " + candidate + " must be newer than the newest pinned baseline " + newestBaseline + ".");
            }
          NODE

            curl --fail --silent --show-error --location --max-time 15 \
              "https://downloads.apache.org/solr/solr/$CANDIDATE_SOLR_VERSION/" > /dev/null
            solr_matrix_include="$(node -e 'const version = process.argv[1]; process.stdout.write(JSON.stringify([22, 24, 26].map(node => ({ "solr-version": version, node }))));' "$CANDIDATE_SOLR_VERSION")"
            echo "Adding official Solr $CANDIDATE_SOLR_VERSION to the qualification matrix."
          fi

          echo "solr_matrix_include=$solr_matrix_include" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            echo "website_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          if [[ -z "$changed_files" ]]; then
            echo "No changed paths detected; running the full CI suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            echo "website_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          docs_changed=false
          website_only=true
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              README.md|CHANGELOG.md|AGENTS.md|.agents/*|.agents/**|scripts/validate-agent-skills.mjs|docs/*.md|docs/**/*.md|docs/*.json|docs/**/*.json)
                docs_changed=true
                website_only=false
                ;;
              website/*|website/**|scripts/site/*|scripts/site/**|test/site-data-validator.test.mjs|test/site-data-generator.test.mjs|test/site-assets.test.mjs|.github/workflows/ci.yml|.github/workflows/pr-preview.yml|.github/workflows/pages.yml)
                docs_only=false
                ;;
              *)
                docs_only=false
                website_only=false
                echo "Application or shared tooling change detected: $path"
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "website_only=$website_only" >> "$GITHUB_OUTPUT"
          echo "Change classification: docs_only=$docs_only docs_changed=$docs_changed website_only=$website_only"
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  dependency-audit:
    name: Dependency vulnerability audit
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=high

  docs:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run docs:check
      - run: npm run test:api-inventory
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  website:
    name: Website build and structural checks
    needs: changes
    if: needs.changes.outputs.website_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and validate website
        run: SITE_GENERATED_AT="$(git log -1 --format=%cI)" npm run build:site

  # Test every supported Node.js LTS line.
  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.website_only != 'true'
    strategy:
      fail-fast: true
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm test
      - name: Publish unit coverage summary (Node 26)
        if: matrix.node == 26
        run: npm run test:coverage >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - run: npm run release:check
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  integration:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.website_only != 'true'
    strategy:
      fail-fast: ${{ !(github.event_name == 'workflow_dispatch' && inputs.candidate_solr_version != '') }}
      matrix:
        solr-version: ["8.11.4", "9.11.0", "10.1.0"]
        node: [22, 24, 26]
        include: ${{ fromJSON(needs.changes.outputs.solr_matrix_include) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Start standalone Solr with pre-created integration core
        run: |
          mkdir -p "$RUNNER_TEMP/solr-backups"
          chmod 777 "$RUNNER_TEMP/solr-backups"
          docker run --detach \
            --name solr \
            --volume "$RUNNER_TEMP/solr-backups:/var/solr/backups" \
            --publish 8983:8983 \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            --env SOLR_OPTS="-Dsolr.allowPaths=/var/solr/backups -Dsolr.disable.shardsWhitelist=true -Dsolr.disable.allowUrls=true -Dsolr.security.allow.urls.enabled=false" \
            "solr:${{ matrix.solr-version }}" \
            solr-precreate integration
      - name: Wait for Solr and integration core
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "http://localhost:8983/solr/admin/cores?action=STATUS&core=integration&wt=json" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Solr integration core did not become healthy within five minutes"
          docker logs solr
          exit 1
      - name: Prepare a reusable configset for CoreAdmin lifecycle fixtures
        run: |
          docker exec solr bash -lc 'mkdir -p /var/solr/data/configsets && cp -a /opt/solr/server/solr/configsets/_default /var/solr/data/configsets/_default'
      - name: Run Solr integration smoke tests
        run: npm run test:integration
        env:
          SOLR_BASE_URL: http://localhost:8983/solr
          SOLR_CORE: integration
          SOLR_VERSION: "${{ matrix.solr-version }}"
          SOLR_BACKUP_LOCATION: /var/solr/backups
          SOLR_V2_INTROSPECTION_OUTPUT: ${{ runner.temp }}/v2-introspection/${{ matrix.solr-version }}/cores.json
      - name: Upload V2 Core Admin introspection fixtures
        if: success() && matrix.node == 26
        uses: actions/upload-artifact@v4
        with:
          name: v2-core-admin-introspection-${{ matrix.solr-version }}
          path: ${{ runner.temp }}/v2-introspection/${{ matrix.solr-version }}/cores.json
          if-no-files-found: error
      - name: Print Solr logs
        if: always()
        run: docker logs solr || true
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  security-integration:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.website_only != 'true'
    strategy:
      fail-fast: ${{ !(github.event_name == 'workflow_dispatch' && inputs.candidate_solr_version != '') }}
      matrix:
        solr-version: ["8.11.4", "9.11.0", "10.1.0"]
        node: [22, 24, 26]
        include: ${{ fromJSON(needs.changes.outputs.solr_matrix_include) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      SOLR_USERNAME: integration-admin
      SOLR_PASSWORD: integration-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Generate isolated BasicAuth security configuration
        run: |
          node --input-type=module <<'NODE'
          import { createHash, randomBytes } from "node:crypto";
          import { writeFileSync } from "node:fs";
          const username = process.env.SOLR_USERNAME;
          const password = process.env.SOLR_PASSWORD;
          const salt = randomBytes(32);
          const firstHash = createHash("sha256")
            .update(Buffer.concat([salt, Buffer.from(password)]))
            .digest();
          const credential = `${createHash("sha256").update(firstHash).digest("base64")} ${salt.toString("base64")}`;
          const security = {
            authentication: {
              class: "solr.BasicAuthPlugin",
              blockUnknown: true,
              credentials: { [username]: credential }
            },
            authorization: {
              class: "solr.RuleBasedAuthorizationPlugin",
              "user-role": { [username]: ["admin"] },
              permissions: [{ name: "all", role: "admin" }]
            }
          };
          writeFileSync("security.json", JSON.stringify(security));
          NODE
          chmod 666 security.json
      - name: Start Solr with security enabled
        run: |
          mkdir -p "$RUNNER_TEMP/solr-backups"
          chmod 777 "$RUNNER_TEMP/solr-backups"
          docker create \
            --name solr-secure \
            --volume "$RUNNER_TEMP/solr-backups:/var/solr/backups" \
            --publish 8983:8983 \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            --env SOLR_OPTS="-Dsolr.allowPaths=/var/solr/backups -Dsolr.disable.shardsWhitelist=true -Dsolr.disable.allowUrls=true -Dsolr.security.allow.urls.enabled=false" \
            --entrypoint /bin/bash \
            "solr:${{ matrix.solr-version }}" \
            -lc 'mkdir -p /var/solr/data && cp /tmp/security.json /var/solr/data/security.json && chmod 666 /var/solr/data/security.json && exec docker-entrypoint.sh solr-precreate integration'
          docker cp security.json solr-secure:/tmp/security.json
          docker start solr-secure
      - name: Wait for authenticated Solr core
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --user "$SOLR_USERNAME:$SOLR_PASSWORD" "http://localhost:8983/solr/admin/cores?action=STATUS&core=integration&wt=json" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Secure Solr integration core did not become healthy within five minutes"
          docker logs solr-secure
          exit 1
      - name: Prepare a reusable configset for CoreAdmin lifecycle fixtures
        run: |
          docker exec solr-secure bash -lc 'mkdir -p /var/solr/data/configsets && cp -a /opt/solr/server/solr/configsets/_default /var/solr/data/configsets/_default'
      - name: Run authenticated Solr integration tests
        run: npm run test:integration
        env:
          SOLR_BASE_URL: http://localhost:8983/solr
          SOLR_CORE: integration
          SOLR_VERSION: "${{ matrix.solr-version }}"
          SOLR_SECURITY: "true"
          SOLR_USERNAME: integration-admin
          SOLR_PASSWORD: integration-password
          SOLR_BACKUP_LOCATION: /var/solr/backups
      - name: Print secure Solr logs
        if: always()
        run: docker logs solr-secure || true
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  cloud-integration:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.website_only != 'true'
    env:
      SOLR_DESTRUCTIVE_OPT_IN: "${{ github.event_name == 'workflow_dispatch' && inputs.enable_destructive_solrcloud_tests == true && 'true' || 'false' }}"
    strategy:
      fail-fast: ${{ !(github.event_name == 'workflow_dispatch' && inputs.candidate_solr_version != '') }}
      matrix:
        solr-version: ["8.11.4", "9.11.0", "10.1.0"]
        node: [22, 24, 26]
        include: ${{ fromJSON(needs.changes.outputs.solr_matrix_include) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Prepare shared backup storage
        run: |
          mkdir -p "$RUNNER_TEMP/solr-backups"
          chmod 777 "$RUNNER_TEMP/solr-backups"
      - name: Start SolrCloud
        run: |
          docker network create solr-cloud-net
          docker run --detach \
            --name solr-cloud \
            --volume "$RUNNER_TEMP/solr-backups:/var/solr/backups" \
            --publish 127.0.0.1:8983:8983 \
            --network solr-cloud-net \
            --network-alias solr-cloud \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            --env SOLR_OPTS="-Dsolr.allowPaths=/var/solr/backups" \
            "solr:${{ matrix.solr-version }}" \
            solr-foreground -c
      - name: Wait for SolrCloud
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "http://localhost:8983/solr/" > /dev/null; then
              echo "SolrCloud HTTP endpoint is ready"
              break
            fi
            sleep 5
          done
          if ! curl --fail --silent "http://localhost:8983/solr/" > /dev/null; then
            echo "SolrCloud HTTP endpoint did not become healthy within five minutes"
            docker logs solr-cloud
            exit 1
          fi
          for attempt in {1..30}; do
            if docker exec solr-cloud bash -lc 'solr zk ls / -z localhost:9983' > /dev/null 2>&1; then
              echo "Embedded ZooKeeper is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Embedded ZooKeeper did not become healthy within one minute"
          docker logs solr-cloud
          exit 1
      - name: Upload the default configset to ZooKeeper
        run: |
          docker exec solr-cloud bash -lc 'solr zk upconfig -n _default -d /opt/solr/server/solr/configsets/_default -z localhost:9983'
      - name: Start a second SolrCloud node
        run: |
          docker run --detach \
            --name solr-cloud-2 \
            --volume "$RUNNER_TEMP/solr-backups:/var/solr/backups" \
            --network solr-cloud-net \
            --publish 127.0.0.1:8984:8983 \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            --env SOLR_OPTS="-Dsolr.allowPaths=/var/solr/backups" \
            "solr:${{ matrix.solr-version }}" \
            solr-foreground -c -z solr-cloud:9983
          for attempt in {1..60}; do
            live_nodes=$(docker exec solr-cloud bash -lc 'solr zk ls /live_nodes -z localhost:9983' 2>/dev/null || true)
            if [ "$(printf '%s\n' "$live_nodes" | grep -c '_solr' || true)" -ge 2 ]; then
              echo "Both SolrCloud nodes joined the cluster"
              exit 0
            fi
            sleep 5
          done
          echo "Second SolrCloud node did not join within five minutes"
          docker logs solr-cloud-2
          exit 1
      - name: Run multi-node SolrCloud integration tests
        run: npm run test:integration
        env:
          SOLR_BASE_URL: http://localhost:8983/solr
          SOLR_CLOUD: "true"
          SOLR_VERSION: "${{ matrix.solr-version }}"
          SOLR_MULTINODE: "true"
          SOLR_BACKUP_LOCATION: /var/solr/backups
      - name: Print SolrCloud logs
        if: always()
        run: |
          docker logs solr-cloud || true
          docker logs solr-cloud-2 || true
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  forceleader-fault-injection:
    name: FORCELEADER stale-replica fault injection (${{ matrix.solr-version }})
    if: github.event_name == 'workflow_dispatch' && inputs.enable_forceleader_fault_injection == true
    strategy:
      fail-fast: false
      matrix:
        solr-version: ["8.11.4", "9.11.0", "10.1.0"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Create isolated SolrCloud network and independent ZooKeeper
        run: |
          docker network create solr-forceleader-net
          docker run --detach \
            --name solr-forceleader-zk \
            --hostname solr-forceleader-zk \
            --network solr-forceleader-net \
            --network-alias solr-forceleader-zk \
            --env ZOO_4LW_COMMANDS_WHITELIST=ruok,stat,srvr \
            --label com.vsimko.solr-ts-client.forceleader=zookeeper \
            zookeeper:3.9.3
      - name: Wait for independent ZooKeeper
        run: |
          for attempt in {1..60}; do
            if docker exec solr-forceleader-zk bash -lc 'zkServer.sh status' > /dev/null 2>&1; then
              echo "Independent ZooKeeper is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs solr-forceleader-zk
          exit 1
      - name: Start primary SolrCloud node
        run: |
          docker run --detach \
            --name solr-forceleader-1 \
            --hostname solr-forceleader-1 \
            --network solr-forceleader-net \
            --network-alias solr-forceleader-1 \
            --publish 127.0.0.1:8983:8983 \
            --label com.vsimko.solr-ts-client.forceleader=true \
            --env SOLR_HOST=solr-forceleader-1 \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            "solr:${{ matrix.solr-version }}" \
            solr-foreground -c -z solr-forceleader-zk:2181
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8983/solr/ > /dev/null &&
              docker exec solr-forceleader-1 bash -lc 'solr zk ls / -z solr-forceleader-zk:2181' > /dev/null 2>&1; then
              echo "Primary SolrCloud node and independent ZooKeeper are ready"
              break
            fi
            sleep 5
          done
          if ! docker exec solr-forceleader-1 bash -lc 'solr zk ls / -z solr-forceleader-zk:2181' > /dev/null 2>&1; then
            docker logs solr-forceleader-zk
            docker logs solr-forceleader-1
            exit 1
          fi
      - name: Upload the default configset to ZooKeeper
        run: |
          docker exec solr-forceleader-1 bash -lc 'solr zk upconfig -n _default -d /opt/solr/server/solr/configsets/_default -z solr-forceleader-zk:2181'
      - name: Start secondary SolrCloud node
        run: |
          docker run --detach \
            --name solr-forceleader-2 \
            --hostname solr-forceleader-2 \
            --network solr-forceleader-net \
            --network-alias solr-forceleader-2 \
            --publish 127.0.0.1:8984:8983 \
            --label com.vsimko.solr-ts-client.forceleader=true \
            --env SOLR_HOST=solr-forceleader-2 \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            "solr:${{ matrix.solr-version }}" \
            solr-foreground -c -z solr-forceleader-zk:2181
          for attempt in {1..60}; do
            live_nodes=$(docker exec solr-forceleader-1 bash -lc 'solr zk ls /live_nodes -z solr-forceleader-zk:2181' 2>/dev/null || true)
            if curl --fail --silent http://127.0.0.1:8984/solr/ > /dev/null &&
              [ "$(printf '%s\n' "$live_nodes" | grep -c '_solr' || true)" -ge 2 ]; then
              echo "Both dedicated SolrCloud nodes joined the independent ZooKeeper cluster"
              exit 0
            fi
            sleep 5
          done
          docker logs solr-forceleader-2
          exit 1
      - name: Run the isolated FORCELEADER scenario only
        run: npm run test:forceleader-optin
        env:
          SOLR_BASE_URL: http://127.0.0.1:8983/solr
          SOLR_CLOUD: "true"
          SOLR_MULTINODE: "true"
          SOLR_DESTRUCTIVE_OPT_IN: "true"
          SOLR_VERSION: "${{ matrix.solr-version }}"
          SOLR_FORCELEADER_PRIMARY_CONTAINER: solr-forceleader-1
          SOLR_FORCELEADER_SECONDARY_CONTAINER: solr-forceleader-2
          SOLR_FORCELEADER_ZK_CONTAINER: solr-forceleader-zk
          SOLR_FORCELEADER_CONTAINER_LABEL: com.vsimko.solr-ts-client.forceleader
          SOLR_FORCELEADER_NETWORK: solr-forceleader-net
          SOLR_FORCELEADER_PRIMARY_PORT: "8983"
          SOLR_FORCELEADER_SECONDARY_PORT: "8984"
      - name: Print FORCELEADER fault-injection logs
        if: always()
        run: |
          docker logs solr-forceleader-1 || true
          docker logs solr-forceleader-2 || true
          docker logs solr-forceleader-zk || true
      - name: Remove dedicated FORCELEADER containers and network
        if: always()
        run: |
          docker rm --force solr-forceleader-1 solr-forceleader-2 solr-forceleader-zk || true
          docker network rm solr-forceleader-net || true
