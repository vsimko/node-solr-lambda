name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm test
      - run: npm run build
      - run: npm run release:check

  integration:
    strategy:
      fail-fast: false
      matrix:
        solr-version: ["8.11.4", "9.11.0", "10.1.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Start standalone Solr with pre-created integration core
        run: |
          docker run --detach \
            --name solr \
            --publish 8983:8983 \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            "solr:${{ matrix.solr-version }}" \
            solr-precreate integration
      - name: Wait for Solr and integration core
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "http://localhost:8983/solr/admin/cores?action=STATUS&core=integration&wt=json" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Solr integration core did not become healthy within five minutes"
          docker logs solr
          exit 1
      - name: Prepare a reusable configset for CoreAdmin lifecycle fixtures
        run: |
          docker exec solr bash -lc 'mkdir -p /var/solr/data/configsets && cp -a /opt/solr/server/solr/configsets/_default /var/solr/data/configsets/_default'
      - name: Run Solr integration smoke tests
        run: npm run test:integration
        env:
          SOLR_BASE_URL: http://localhost:8983/solr
          SOLR_CORE: integration
      - name: Print Solr logs
        if: always()
        run: docker logs solr || true

  cloud-integration:
    strategy:
      fail-fast: false
      matrix:
        solr-version: ["8.11.4", "9.11.0", "10.1.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Start SolrCloud
        run: |
          docker run --detach \
            --name solr-cloud \
            --publish 8983:8983 \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            "solr:${{ matrix.solr-version }}" \
            solr -c
      - name: Wait for SolrCloud
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "http://localhost:8983/solr/admin/info/system?wt=json" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "SolrCloud did not become healthy within five minutes"
          docker logs solr-cloud
          exit 1
      - name: Upload the default configset to ZooKeeper
        run: |
          docker exec solr-cloud bash -lc 'solr zk upconfig -n _default -d /opt/solr/server/solr/configsets/_default'
      - name: Run SolrCloud integration tests
        run: npm run test:integration
        env:
          SOLR_BASE_URL: http://localhost:8983/solr
          SOLR_CLOUD: "true"
      - name: Print SolrCloud logs
        if: always()
        run: docker logs solr-cloud || true
