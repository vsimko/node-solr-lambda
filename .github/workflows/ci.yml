name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm test
      - run: npm run build
      - run: npm run release:check

  integration:
    strategy:
      fail-fast: false
      matrix:
        solr-version: ["8.11.4", "9.11.0", "10.1.0"]
    runs-on: ubuntu-latest
    services:
      solr:
        image: solr:${{ matrix.solr-version }}
        ports:
          - 8983:8983
        env:
          SOLR_JAVA_MEM: "-Xms512m -Xmx512m"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Wait for Solr health endpoint
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "http://localhost:8983/solr/admin/info/system?wt=json" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Solr did not become healthy within five minutes"
          exit 1
      - name: Create isolated integration core
        run: |
          container_id="$(docker ps --filter "ancestor=solr:${{ matrix.solr-version }}" --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" solr create -c integration
      - name: Run Solr integration smoke tests
        run: npm run test:integration
        env:
          SOLR_BASE_URL: http://localhost:8983/solr
          SOLR_CORE: integration
