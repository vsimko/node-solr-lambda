name: CI

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, docs/github-pages-architecture]
  workflow_dispatch:
    inputs:
      enable_destructive_solrcloud_tests:
        description: "Run opt-in SPLITSHARD and MIGRATE checks on the disposable two-node cluster"
        required: false
        default: false
        type: boolean
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      website_only: ${{ steps.classify.outputs.website_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify change set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          if [[ -z "$changed_files" ]]; then
            echo "No changed paths detected; running the full CI suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "website_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          website_only=true
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              README.md|docs/*.md|docs/**/*.md)
                website_only=false
                ;;
              website/*|website/**|scripts/site/*|scripts/site/**|test/site-data-validator.test.mjs|test/site-data-generator.test.mjs|.github/workflows/ci.yml|.github/workflows/pr-preview.yml|.github/workflows/pages.yml)
                docs_only=false
                ;;
              *)
                docs_only=false
                website_only=false
                echo "Application or shared tooling change detected: $path"
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "website_only=$website_only" >> "$GITHUB_OUTPUT"
          echo "Change classification: docs_only=$docs_only website_only=$website_only"
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  docs:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run docs:check
      - run: npm run test:api-inventory
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  website:
    name: Website build and structural checks
    needs: changes
    if: needs.changes.outputs.website_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and validate website
        run: npm run build:site

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.website_only != 'true' && needs.changes.outputs.website_only != 'true'
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  integration:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.website_only != 'true'
    strategy:
      fail-fast: true
      matrix:
        solr-version: ["8.11.4", "9.11.0", "10.1.0"]
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Start standalone Solr with pre-created integration core
        run: |
          mkdir -p "$RUNNER_TEMP/solr-backups"
          chmod 777 "$RUNNER_TEMP/solr-backups"
          docker run --detach \
            --name solr \
            --volume "$RUNNER_TEMP/solr-backups:/var/solr/backups" \
            --publish 8983:8983 \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            --env SOLR_OPTS="-Dsolr.allowPaths=/var/solr/backups -Dsolr.disable.shardsWhitelist=true -Dsolr.disable.allowUrls=true -Dsolr.security.allow.urls.enabled=false" \
            "solr:${{ matrix.solr-version }}" \
            solr-precreate integration
      - name: Wait for Solr and integration core
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "http://localhost:8983/solr/admin/cores?action=STATUS&core=integration&wt=json" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Solr integration core did not become healthy within five minutes"
          docker logs solr
          exit 1
      - name: Prepare a reusable configset for CoreAdmin lifecycle fixtures
        run: |
          docker exec solr bash -lc 'mkdir -p /var/solr/data/configsets && cp -a /opt/solr/server/solr/configsets/_default /var/solr/data/configsets/_default'
      - name: Run Solr integration smoke tests
        run: npm run test:integration
        env:
          SOLR_BASE_URL: http://localhost:8983/solr
          SOLR_CORE: integration
          SOLR_VERSION: "${{ matrix.solr-version }}"
          SOLR_BACKUP_LOCATION: /var/solr/backups
      - name: Print Solr logs
        if: always()
        run: docker logs solr || true
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  security-integration:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.website_only != 'true'
    strategy:
      fail-fast: true
      matrix:
        solr-version: ["8.11.4", "9.11.0", "10.1.0"]
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    env:
      SOLR_USERNAME: integration-admin
      SOLR_PASSWORD: integration-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Generate isolated BasicAuth security configuration
        run: |
          node --input-type=module <<'NODE'
          import { createHash, randomBytes } from "node:crypto";
          import { writeFileSync } from "node:fs";
          const username = process.env.SOLR_USERNAME;
          const password = process.env.SOLR_PASSWORD;
          const salt = randomBytes(32);
          const firstHash = createHash("sha256")
            .update(Buffer.concat([salt, Buffer.from(password)]))
            .digest();
          const credential = `${createHash("sha256").update(firstHash).digest("base64")} ${salt.toString("base64")}`;
          const security = {
            authentication: {
              class: "solr.BasicAuthPlugin",
              blockUnknown: true,
              credentials: { [username]: credential }
            },
            authorization: {
              class: "solr.RuleBasedAuthorizationPlugin",
              "user-role": { [username]: ["admin"] },
              permissions: [{ name: "all", role: "admin" }]
            }
          };
          writeFileSync("security.json", JSON.stringify(security));
          NODE
          chmod 666 security.json
      - name: Start Solr with security enabled
        run: |
          mkdir -p "$RUNNER_TEMP/solr-backups"
          chmod 777 "$RUNNER_TEMP/solr-backups"
          docker create \
            --name solr-secure \
            --volume "$RUNNER_TEMP/solr-backups:/var/solr/backups" \
            --publish 8983:8983 \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            --env SOLR_OPTS="-Dsolr.allowPaths=/var/solr/backups -Dsolr.disable.shardsWhitelist=true -Dsolr.disable.allowUrls=true -Dsolr.security.allow.urls.enabled=false" \
            --entrypoint /bin/bash \
            "solr:${{ matrix.solr-version }}" \
            -lc 'mkdir -p /var/solr/data && cp /tmp/security.json /var/solr/data/security.json && chmod 666 /var/solr/data/security.json && exec docker-entrypoint.sh solr-precreate integration'
          docker cp security.json solr-secure:/tmp/security.json
          docker start solr-secure
      - name: Wait for authenticated Solr core
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --user "$SOLR_USERNAME:$SOLR_PASSWORD" "http://localhost:8983/solr/admin/cores?action=STATUS&core=integration&wt=json" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Secure Solr integration core did not become healthy within five minutes"
          docker logs solr-secure
          exit 1
      - name: Prepare a reusable configset for CoreAdmin lifecycle fixtures
        run: |
          docker exec solr-secure bash -lc 'mkdir -p /var/solr/data/configsets && cp -a /opt/solr/server/solr/configsets/_default /var/solr/data/configsets/_default'
      - name: Run authenticated Solr integration tests
        run: npm run test:integration
        env:
          SOLR_BASE_URL: http://localhost:8983/solr
          SOLR_CORE: integration
          SOLR_VERSION: "${{ matrix.solr-version }}"
          SOLR_SECURITY: "true"
          SOLR_USERNAME: integration-admin
          SOLR_PASSWORD: integration-password
          SOLR_BACKUP_LOCATION: /var/solr/backups
      - name: Print secure Solr logs
        if: always()
        run: docker logs solr-secure || true
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true

  cloud-integration:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.website_only != 'true'
    env:
      SOLR_DESTRUCTIVE_OPT_IN: "${{ github.event_name == 'workflow_dispatch' && inputs.enable_destructive_solrcloud_tests == true && 'true' || 'false' }}"
    strategy:
      fail-fast: true
      matrix:
        solr-version: ["8.11.4", "9.11.0", "10.1.0"]
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Prepare shared backup storage
        run: |
          mkdir -p "$RUNNER_TEMP/solr-backups"
          chmod 777 "$RUNNER_TEMP/solr-backups"
      - name: Start SolrCloud
        run: |
          docker network create solr-cloud-net
          docker run --detach \
            --name solr-cloud \
            --volume "$RUNNER_TEMP/solr-backups:/var/solr/backups" \
            --publish 8983:8983 \
            --network solr-cloud-net \
            --network-alias solr-cloud \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            --env SOLR_OPTS="-Dsolr.allowPaths=/var/solr/backups" \
            "solr:${{ matrix.solr-version }}" \
            solr-foreground -c
      - name: Wait for SolrCloud
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "http://localhost:8983/solr/" > /dev/null; then
              echo "SolrCloud HTTP endpoint is ready"
              break
            fi
            sleep 5
          done
          if ! curl --fail --silent "http://localhost:8983/solr/" > /dev/null; then
            echo "SolrCloud HTTP endpoint did not become healthy within five minutes"
            docker logs solr-cloud
            exit 1
          fi
          for attempt in {1..30}; do
            if docker exec solr-cloud bash -lc 'solr zk ls / -z localhost:9983' > /dev/null 2>&1; then
              echo "Embedded ZooKeeper is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Embedded ZooKeeper did not become healthy within one minute"
          docker logs solr-cloud
          exit 1
      - name: Upload the default configset to ZooKeeper
        run: |
          docker exec solr-cloud bash -lc 'solr zk upconfig -n _default -d /opt/solr/server/solr/configsets/_default -z localhost:9983'
      - name: Start a second SolrCloud node
        run: |
          docker run --detach \
            --name solr-cloud-2 \
            --volume "$RUNNER_TEMP/solr-backups:/var/solr/backups" \
            --network solr-cloud-net \
            --publish 8984:8983 \
            --env SOLR_JAVA_MEM="-Xms512m -Xmx512m" \
            --env SOLR_OPTS="-Dsolr.allowPaths=/var/solr/backups" \
            "solr:${{ matrix.solr-version }}" \
            solr-foreground -c -z solr-cloud:9983
          for attempt in {1..60}; do
            live_nodes=$(docker exec solr-cloud bash -lc 'solr zk ls /live_nodes -z localhost:9983' 2>/dev/null || true)
            if [ "$(printf '%s\n' "$live_nodes" | grep -c '_solr' || true)" -ge 2 ]; then
              echo "Both SolrCloud nodes joined the cluster"
              exit 0
            fi
            sleep 5
          done
          echo "Second SolrCloud node did not join within five minutes"
          docker logs solr-cloud-2
          exit 1
      - name: Run multi-node SolrCloud integration tests
        run: npm run test:integration
        env:
          SOLR_BASE_URL: http://localhost:8983/solr
          SOLR_CLOUD: "true"
          SOLR_MULTINODE: "true"
          SOLR_BACKUP_LOCATION: /var/solr/backups
      - name: Print SolrCloud logs
        if: always()
        run: |
          docker logs solr-cloud || true
          docker logs solr-cloud-2 || true
      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true
