# Mutation targets are sharded into independent jobs; progress is emitted by Stryker's progress reporter.
name: Mutation testing

on:
  workflow_dispatch:
  push:
    branches:
      - test/mutation-baseline
      - test/mutation-tap-runner
    paths:
      - ".github/workflows/mutation.yml"
      - "stryker.config.json"
      - "src/transport.ts"
      - "src/apis/update.ts"
      - "src/apis/collections.ts"
      - "src/apis/core-admin.ts"
      - "test/**"
      - "docs/testing-strategy.md"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation / ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - module: transport
            mutate: src/transport.ts
          - module: update
            mutate: src/apis/update.ts
          - module: collections
            mutate: src/apis/collections.ts
          - module: core-admin
            mutate: src/apis/core-admin.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install pinned mutation tooling
        run: npm install --no-save --no-package-lock @stryker-mutator/core@10.0.0 @stryker-mutator/typescript-checker@10.0.0 @stryker-mutator/tap-runner@10.0.0

      - name: Run mutation tests for ${{ matrix.module }}
        run: npx --no-install stryker run --mutate "${{ matrix.mutate }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.module }}-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Verify mutation reports
        if: success()
        run: test -s reports/mutation/mutation.html && test -s reports/mutation/mutation.json
