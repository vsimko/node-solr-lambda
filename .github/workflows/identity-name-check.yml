name: Identity name availability experiment

on:
  push:
    branches:
      - experiment/solr-ts-client-name-check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only public registry checks
        run: node scripts/check-project-identity.mjs | tee identity-check-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: solr-ts-client-identity-check
          path: identity-check-report.json
          if-no-files-found: error
