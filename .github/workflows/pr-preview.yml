name: Pull request website preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "website/**"
      - "scripts/site/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
      - "package-lock.json"
      - "test/site-data-validator.test.mjs"
      - "test/site-data-generator.test.mjs"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Never grant write-enabled preview deployment to untrusted fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build website
        if: github.event.action != 'closed'
        run: SITE_GENERATED_AT="$(git log -1 --format=%cI)" npm run build:site
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish or remove pull-request preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976
        with:
          source-dir: dist-site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          wait-for-pages-deployment: true
          comment: true
          qr-code: false

      - name: Cancel all workflows for this pull request after failure
        if: failure() && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          run_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID | tonumber)) | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.PR_HEAD_SHA)) | select(.status == "queued" or .status == "in_progress") | .id')"
          for run_id in $run_ids; do
            echo "Cancelling sibling workflow run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          echo "Cancelling this workflow run"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" || true
