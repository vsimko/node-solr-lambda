name: Solr upstream release watch

on:
  schedule:
    - cron: "13 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: solr-upstream-release-watch
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
      - name: Detect official Solr releases missing from the CI matrix
        id: detect
        run: node scripts/check-solr-releases.mjs
      - name: Create qualification issues
        if: steps.detect.outputs.missing_versions != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          available_versions: ${{ steps.detect.outputs.available_versions }}
          configured_versions: ${{ steps.detect.outputs.configured_versions }}
          missing_versions: ${{ steps.detect.outputs.missing_versions }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const available = core.getInput("available_versions");
            const configured = core.getInput("configured_versions");
            const missing = core.getInput("missing_versions").split(",").filter(Boolean);

            for (const version of missing) {
              const title = `ci: qualify Apache Solr ${version}`;
              const [major, minor, patch] = version.split(".");
              const docsVersion = `${major}_${minor}_${patch}`;
              const guideVersion = `${major}_${minor}`;
              const metadata = [
                "<!-- solr-release-watch:metadata:start -->",
                `## Candidate Apache Solr release: ${version}`,
                "",
                "The official Apache download index lists this stable release, but it is not present in the repository's pinned CI matrix.",
                "",
                `- Official download directory: https://downloads.apache.org/solr/solr/${version}/`,
                `- Release notes: https://solr.apache.org/docs/${docsVersion}/changes/Changes.html`,
                `- OpenAPI specification: https://downloads.apache.org/solr/solr/${version}/openApi/solr-openapi-${version}.json`,
                `- Docker images: solr:${version} and solr:${version}-slim (https://hub.docker.com/_/solr)`,
                `- Reference guide: https://solr.apache.org/guide/solr/${guideVersion}/`,
                "- Official release overview: https://solr.apache.org/downloads.html",
                `- Versions currently pinned in CI: ${configured || "(none detected)"}`,
                `- Stable versions currently listed upstream: ${available || "(none detected)"}`,
                "",
                "This notification does **not** certify or automatically add support for the candidate version.",
                "<!-- solr-release-watch:metadata:end -->"
              ].join("\\n");

              const existing = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue "${title}"`
              });
              const trackedIssue = existing.data.items.find(issue => issue.title === title);

              if (trackedIssue) {
                const current = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: trackedIssue.number
                });
                const currentBody = current.data.body || "";
                const markers = /<!-- solr-release-watch:metadata:start -->[\\s\\S]*?<!-- solr-release-watch:metadata:end -->/;
                let updatedBody;

                if (markers.test(currentBody)) {
                  updatedBody = currentBody.replace(markers, metadata);
                } else if (currentBody.startsWith(`## Candidate Apache Solr release: ${version}`)) {
                  const checklistIndex = currentBody.indexOf("## Qualification checklist");
                  updatedBody = checklistIndex >= 0
                    ? `${metadata}\\n\\n${currentBody.slice(checklistIndex)}`
                    : `${currentBody}\\n\\n${metadata}`;
                } else {
                  updatedBody = `${currentBody.trim()}\\n\\n${metadata}`;
                }

                if (updatedBody !== currentBody) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: trackedIssue.number,
                    body: updatedBody
                  });
                  core.info(`Refreshed release metadata on issue #${trackedIssue.number} for Solr ${version}.`);
                } else {
                  core.info(`Release metadata on issue #${trackedIssue.number} is already current.`);
                }
                continue;
              }

              const body = [
                metadata,
                "",
                "## Qualification checklist",
                "- [ ] Review the official release notes and reference guide.",
                "- [ ] Add the exact image version to standalone, security-enabled, and SolrCloud matrices in a reviewed PR.",
                "- [ ] Run the full required matrix and inspect operation-level failures.",
                "- [ ] Update API inventory, compatibility policy, endpoint coverage, and release notes from completed evidence.",
                "- [ ] Decide whether this release becomes a supported baseline or is explicitly deferred.",
                "",
                "Follow the qualification procedure in docs/compatibility.md and link the evidence here."
              ].join("\\n");

              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["ci"]
              });
              core.info(`Created qualification issue for Solr ${version}.`);
            }
