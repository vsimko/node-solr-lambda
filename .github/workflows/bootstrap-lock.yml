name: Bootstrap npm lockfile

on:
  push:
    branches: [v4-npm-issue-112]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-npm-issue-112
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove bootstrap workflow and commit lockfile
        run: |
          git rm .github/workflows/bootstrap-lock.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: generate npm lockfile"
          git push origin HEAD:v4-npm-issue-112
